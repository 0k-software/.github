name: "Check PR size"
description: "Count added lines on a PR (excluding configured paths) and post a REQUEST_CHANGES review when the PR exceeds a configurable limit."
author: "0k-software"

branding:
  icon: "git-pull-request"
  color: "blue"

inputs:
  limit:
    description: "Maximum number of added lines allowed on the PR."
    required: true
  warn-threshold:
    description: "Fraction of `limit` (between 0 and 1) above which the badge colour flips to warning."
    required: false
    default: "0.8"
  ignored-paths:
    description: |
      Newline- or comma-separated list of git pathspec excludes applied to
      the line count. Each entry may be given as a bare path (`priv/static/**`)
      or with the pathspec magic prefix already attached (`:!priv/static/**`).
    required: false
    default: ""
  body-match-pattern:
    description: |
      Literal prefix written at the top of every posted review. Reviews from
      `github-actions[bot]` whose body starts with this prefix are treated as
      stale on the next run and get dismissed (if still blocking) and
      minimised as OUTDATED.
    required: false
    default: "<!-- pr-size -->"

runs:
  using: "composite"
  steps:
    - name: "Check PR size"
      id: pr-size
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.base_ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO: ${{ github.repository }}
        MAX_LINES: ${{ inputs.limit }}
        WARN_THRESHOLD: ${{ inputs.warn-threshold }}
        IGNORED_PATHS: ${{ inputs.ignored-paths }}
        MARKER: ${{ inputs.body-match-pattern }}
      run: |
        BASE="origin/${BASE_REF}"

        # Parse ignored-paths: accept newline- or comma-separated entries,
        # strip whitespace, normalise to git pathspec excludes (`:!<pattern>`).
        EXCLUDES=()
        while IFS= read -r line; do
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          [ -z "$line" ] && continue
          stripped="${line#:!}"
          EXCLUDES+=(":!${stripped}")
        done < <(printf '%s\n' "${IGNORED_PATHS}" | tr ',' '\n')

        echo "::group::Inputs"
        echo "Repo:         ${REPO}"
        echo "PR number:    ${PR_NUMBER}"
        echo "Base ref:     ${BASE}"
        echo "Head sha:     ${HEAD_SHA}"
        echo "Max lines:    ${MAX_LINES}"
        echo "Excludes:     ${EXCLUDES[*]}"
        echo "Marker:       ${MARKER}"
        echo "::endgroup::"

        echo "::group::Count diff lines"
        TOTAL_ADDED=$(git diff --diff-filter=ACMR "${BASE}...HEAD" \
          | grep -cE '^\+([^+]|$)' || true)
        TOTAL_DELETED=$(git diff --diff-filter=ACMR "${BASE}...HEAD" \
          | grep -cE '^-([^-]|$)' || true)
        IGNORED=0
        for exc in "${EXCLUDES[@]}"; do
          pattern="${exc#:!}"
          file_added=$(git diff --diff-filter=ACMR "${BASE}...HEAD" -- "${pattern}" \
            | grep -cE '^\+([^+]|$)' || true)
          IGNORED=$((IGNORED + file_added))
        done
        ADDED=$((TOTAL_ADDED - IGNORED))
        echo "Counted added:   ${ADDED}"
        echo "Total added:     ${TOTAL_ADDED}"
        echo "Total deleted:   ${TOTAL_DELETED}"
        echo "Ignored:         ${IGNORED}"
        echo "::endgroup::"

        echo "::group::Decide verdict"
        WARN_LINES=$(awk -v l="$MAX_LINES" -v w="$WARN_THRESHOLD" 'BEGIN { printf "%d", l * w }')
        if [ "$ADDED" -gt "$MAX_LINES" ]; then
          EVENT="REQUEST_CHANGES"
          ICON=":warning:"
          BADGE_STATUS="over%20the%20limit"
          COLOR="cf222e"
        else
          EVENT="COMMENT"
          ICON=":white_check_mark:"
          BADGE_STATUS="under%20the%20limit"
          if [ "$ADDED" -gt "$WARN_LINES" ]; then
            COLOR="bf8700"
          else
            COLOR="2ea44f"
          fi
        fi
        echo "Event:  ${EVENT}"
        echo "Icon:   ${ICON}"
        echo "Badge:  ${BADGE_STATUS}"
        echo "Color:  ${COLOR}"
        echo "::endgroup::"

        BODY=$(cat <<EOF
        ${MARKER}
        ## ${ICON} PR size ![](https://img.shields.io/badge/${ADDED}%20lines%20-${BADGE_STATUS}-${COLOR})

        > [!NOTE]
        > Only **added/modified lines** count toward the limit.
        > Deleted lines and ignored file patterns are excluded.

        | | Lines |
        |--------|------:|
        | :white_circle: Ignored | ${IGNORED} |
        | :green_circle: Counted | **${ADDED}** |
        | :red_circle: Limit | ${MAX_LINES} |

        <details>
        <summary>Ignored file patterns</summary>

        $(printf -- '- <code>%s</code>\n' "${EXCLUDES[@]//:!/}")

        </details>

        ### Total Lines
        \`\`\`diff
        + Added:    ${TOTAL_ADDED}
        - Deleted:  ${TOTAL_DELETED}
        \`\`\`
        EOF
        )

        # Clean up previous pr-size reviews from github-actions[bot].
        # Submitted reviews can't be deleted via the REST API, so we dismiss
        # CHANGES_REQUESTED ones (to clear the merge block) and minimize all
        # of them as OUTDATED (matches the UI's "Hide" -> "Outdated" action)
        # so they don't clutter the PR timeline.
        # --paginate is required: the reviews endpoint returns 30 per page,
        # and PRs with many comment-style reviews push older bot reviews
        # off the first page, causing them to silently escape cleanup.
        # The jq filter emits a stream of objects (no outer array) so each
        # page's output concatenates into a single valid stream.
        echo "::group::GET repos/${REPO}/pulls/${PR_NUMBER}/reviews"
        PREVIOUS=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"${MARKER}\")) | {id, node_id, state}")
        echo "Matching previous reviews:"
        echo "$PREVIOUS" | jq -s .
        echo "::endgroup::"

        echo "$PREVIOUS" | jq -r '[.id, .node_id, .state] | @tsv' \
          | while IFS=$'\t' read -r rid node_id rstate; do
              echo "::group::Hide previous review ${rid} (state=${rstate})"
              if [ "$rstate" = "CHANGES_REQUESTED" ]; then
                echo "PUT repos/${REPO}/pulls/${PR_NUMBER}/reviews/${rid}/dismissals"
                DISMISS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${rid}/dismissals" \
                  -X PUT -f message="Superseded by new check")
                echo "Dismissal response:"
                echo "$DISMISS" | jq '{id, state, submitted_at}'
              fi
              echo "GraphQL minimizeComment(subjectId=${node_id}, classifier=OUTDATED)"
              MINIMIZE=$(gh api graphql -f query='mutation($id: ID!) {
                minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                  minimizedComment { isMinimized }
                }
              }' -f id="$node_id")
              echo "Minimize response:"
              echo "$MINIMIZE" | jq .
              echo "::endgroup::"
            done

        echo "::group::POST repos/${REPO}/pulls/${PR_NUMBER}/reviews (event=${EVENT})"
        CREATED=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
          -X POST -f body="$BODY" -f event="$EVENT" -f commit_id="${HEAD_SHA}")
        echo "New review:"
        echo "$CREATED" | jq '{id, state, html_url, submitted_at, commit_id}'
        echo "::endgroup::"
