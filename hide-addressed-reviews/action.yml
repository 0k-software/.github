name: Hide addressed reviews
description: >
  Minimize LGTM-style bot reviews (and Copilot PR reviews) on a pull request
  once every review thread they opened is resolved. Keeps the conversation
  pane clean without hiding reviews that still have outstanding asks.

branding:
  icon: eye-off
  color: purple

inputs:
  body-match-pattern:
    description: >
      Case-insensitive PCRE regex (evaluated by jq `test()`) matched against
      each review body (after `ascii_downcase`). Reviews whose body matches,
      OR whose author is `copilot-pull-request-reviewer`, are candidates for
      hiding. The default matches an empty body or a bare wrap-up acronym.
    required: false
    default: '^\s*(lgtm|lbtm|ack|nack)?\s*$'
  classifier:
    description: >
      minimizeComment classifier applied when hiding the review. One of
      RESOLVED, OUTDATED, OFF_TOPIC, DUPLICATE, SPAM, ABUSE.
    required: false
    default: RESOLVED
  pr-number:
    description: >
      Pull request number to operate on. Defaults to the PR that triggered the
      calling workflow (`github.event.pull_request.number`).
    required: false
    default: ""
  github-token:
    description: >
      Token used to call the GitHub GraphQL API. Requires pull-requests:write.
      Composite actions do not inherit secrets from the calling workflow, so
      pass the token explicitly if you need to override the default
      (`github.token`).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Hide fully-addressed reviews
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.github-token != '' && inputs.github-token || github.token }}
        PR_NUMBER: ${{ inputs.pr-number != '' && inputs.pr-number || github.event.pull_request.number }}
        OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        BODY_MATCH_PATTERN: ${{ inputs.body-match-pattern }}
        CLASSIFIER: ${{ inputs.classifier }}
      run: |
        # A review is "addressed" when both conditions hold:
        #   1. its body is empty, one of the wrap-up acronyms — LGTM,
        #      LBTM, ACK, NACK (case-insensitive, whitespace-trimmed),
        #      OR it was submitted by Copilot (which always writes a
        #      summary body but carries all of its feedback as thread
        #      comments, so the body itself has no outstanding asks)
        #   2. every thread it opened is already resolved
        # Condition (1) guards against hiding reviews whose main comment
        # still carries new requests, and (2) means the outstanding work
        # the reviewer flagged is closed — so the review is a wrap-up
        # signal either way (approval, rejection, or silent) with nothing
        # loose hanging off it.
        echo "::group::Fetch reviews and threads"
        DATA=$(gh api graphql \
          -F owner="$OWNER" -F repo="$REPO_NAME" -F pr="$PR_NUMBER" \
          -f query='
            query($owner:String!, $repo:String!, $pr:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$pr) {
                  reviews(first:100) {
                    nodes {
                      id
                      databaseId
                      body
                      state
                      isMinimized
                      author { login }
                      comments(first:100) { nodes { databaseId } }
                    }
                  }
                  reviewThreads(first:100) {
                    nodes {
                      isResolved
                      comments(first:100) { nodes { databaseId } }
                    }
                  }
                }
              }
            }')
        echo "$DATA" | jq '.data.repository.pullRequest
          | { reviews: (.reviews.nodes | length),
              threads: (.reviewThreads.nodes | length) }'
        echo "::endgroup::"

        echo "::group::Pick reviews to hide"
        TARGETS=$(echo "$DATA" | jq -r --arg pattern "$BODY_MATCH_PATTERN" '
          .data.repository.pullRequest as $pr
          | ($pr.reviewThreads.nodes
              | map({
                  isResolved,
                  commentIds: (.comments.nodes | map(.databaseId))
                })) as $threads
          | $pr.reviews.nodes[]
          | select(.isMinimized == false)
          | select(
              (.author.login == "copilot-pull-request-reviewer")
              or ((.body // "") | ascii_downcase | test($pattern)))
          | . as $r
          | ($r.comments.nodes | map(.databaseId)) as $rCommentIds
          | ($threads
              | map(select(.commentIds
                  | any(. as $id | $rCommentIds | index($id)))))
            as $rThreads
          | select($rThreads | all(.isResolved))
          | [$r.id, $r.author.login, $r.state, ($r.body // "" | .[0:20])]
            | @tsv')

        if [ -z "$TARGETS" ]; then
          echo "No reviews to hide."
          echo "::endgroup::"
          exit 0
        fi

        echo "Candidates (id, author, state, body):"
        echo "$TARGETS"
        echo "::endgroup::"

        echo "$TARGETS" \
          | while IFS=$'\t' read -r rid author rstate rbody; do
              echo "::group::Minimize ${rid} (${author}, ${rstate}, ${rbody})"
              RESP=$(gh api graphql \
                -f id="$rid" -f classifier="$CLASSIFIER" \
                -f query='mutation($id: ID!, $classifier: ReportedContentClassifiers!) {
                  minimizeComment(input: { subjectId: $id, classifier: $classifier }) {
                    minimizedComment { isMinimized }
                  }
                }')
              echo "$RESP" | jq .
              echo "::endgroup::"
            done
