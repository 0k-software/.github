name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check templates are in sync
        run: bin/check-skill-templates

      - name: Check formatting (Prettier)
        run: npx --yes prettier@3.8.1 --check "**/*.md"

      - name: Hide addressed reviews
        if: github.event_name == 'pull_request'
        uses: ./hide-addressed-reviews

      - name: Check PR size
        if: github.event_name == 'pull_request'
        uses: ./check-pr-size
        with:
          limit: 500
