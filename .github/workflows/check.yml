name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check templates are in sync
        run: bin/check-skill-templates

      - name: Check formatting (Prettier)
        run: npx --yes prettier@3.8.1 --check "**/*.md"

      - name: Hide addressed reviews
        if: github.event_name == 'pull_request'
        uses: ./hide-addressed-reviews

      - name: Check PR size
        if: github.event_name == 'pull_request'
        uses: ./check-pr-size
        with:
          limit: 500
          ignored-paths: "issue-hygiene/package-lock.json"

      - name: Detect issue-hygiene changes
        id: ih
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            count=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- issue-hygiene/ | wc -l)
          else
            count=$(git diff --name-only HEAD^1 -- issue-hygiene/ 2>/dev/null | wc -l || echo 1)
          fi
          echo "changed=$([[ $count -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Issue hygiene — lint
        if: steps.ih.outputs.changed == 'true'
        working-directory: issue-hygiene
        run: npm ci && npm run lint

      - name: Issue hygiene — test
        if: steps.ih.outputs.changed == 'true'
        working-directory: issue-hygiene
        run: npm test

      - name: Issue hygiene — build
        if: steps.ih.outputs.changed == 'true'
        working-directory: issue-hygiene
        run: npm run build
