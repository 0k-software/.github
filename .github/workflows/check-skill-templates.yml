name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check templates are in sync
        run: bin/check-skill-templates

      - name: Check formatting (Prettier)
        run: npx --yes prettier@3.3.3 --check "**/*.md"
