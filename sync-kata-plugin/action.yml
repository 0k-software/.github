name: "Sync kata plugin"
description: "Vendor the kata Claude Code plugin from 0k-software/kata into a target repo, opening a PR if the snapshot is outdated or missing."
author: "0k-software"

branding:
  icon: "download"
  color: "blue"

inputs:
  token:
    description: |
      PAT or GitHub App token with `contents: write` and `pull-requests: write`
      on the target repository. Used by the PR creation step (and by `gh` when
      resolving `latest`).
    required: true
  kata-ref:
    description: |
      Tag, branch, or SHA of `0k-software/kata` to sync from. Defaults to
      `latest`, which resolves to the most recent published release tag of
      the kata repo.
    required: false
    default: "latest"
  path:
    description: "Path within the target repo where the plugin lives."
    required: false
    default: ".claude/plugins/kata"
  pr-branch-prefix:
    description: |
      Prefix for the PR branch. The kata version is appended (e.g.
      `chore/sync-kata-plugin-v1.2.3`), so re-running with the same upstream
      version updates the existing PR instead of opening a new one.
    required: false
    default: "chore/sync-kata-plugin"

outputs:
  needs-sync:
    description: "`true` if the target was out of date and a PR was opened/updated, `false` otherwise."
    value: ${{ steps.compare.outputs.needs-sync }}
  current-version:
    description: "Version found in the target repo's plugin.json before sync (`(missing)` if absent)."
    value: ${{ steps.compare.outputs.current-version }}
  upstream-version:
    description: "Version found in kata's plugin.json at the resolved ref."
    value: ${{ steps.fetch.outputs.upstream-version }}
  pull-request-number:
    description: "Number of the PR opened or updated by this run (empty when no sync was needed)."
    value: ${{ steps.pr.outputs.pull-request-number }}

runs:
  using: "composite"
  steps:
    - id: resolve
      name: "Resolve kata ref"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KATA_REF: ${{ inputs.kata-ref }}
      run: |
        echo "::group::Resolve ref"
        if [ "$KATA_REF" = "latest" ]; then
          ref=$(gh release view --repo 0k-software/kata --json tagName --jq .tagName)
          if [ -z "$ref" ]; then
            echo "::error::No releases found on 0k-software/kata. Cut a release before using kata-ref: latest."
            exit 1
          fi
        else
          ref="$KATA_REF"
        fi
        echo "Resolved kata ref: $ref"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"

    - id: fetch
      name: "Fetch kata plugin contents"
      shell: bash
      env:
        REF: ${{ steps.resolve.outputs.ref }}
      run: |
        echo "::group::Clone 0k-software/kata@$REF"
        workdir="$RUNNER_TEMP/kata-src"
        rm -rf "$workdir"
        git clone --depth 1 --branch "$REF" https://github.com/0k-software/kata.git "$workdir"
        upstream="$workdir/.claude/plugins/kata"
        if [ ! -f "$upstream/.claude-plugin/plugin.json" ]; then
          echo "::error::No plugin manifest at .claude/plugins/kata/.claude-plugin/plugin.json in 0k-software/kata@$REF."
          exit 1
        fi
        version=$(jq -r .version "$upstream/.claude-plugin/plugin.json")
        echo "Upstream version: $version"
        echo "upstream-dir=$upstream" >> "$GITHUB_OUTPUT"
        echo "upstream-version=$version" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"

    - id: compare
      name: "Compare against current version in target"
      shell: bash
      env:
        TARGET_PATH: ${{ inputs.path }}
        UPSTREAM_VERSION: ${{ steps.fetch.outputs.upstream-version }}
      run: |
        echo "::group::Compare versions"
        manifest="$TARGET_PATH/.claude-plugin/plugin.json"
        if [ -f "$manifest" ]; then
          current=$(jq -r .version "$manifest")
        else
          current="(missing)"
        fi
        echo "Current version: $current"
        echo "Upstream version: $UPSTREAM_VERSION"
        echo "current-version=$current" >> "$GITHUB_OUTPUT"
        if [ "$current" = "$UPSTREAM_VERSION" ]; then
          echo "needs-sync=false" >> "$GITHUB_OUTPUT"
          echo "Already up to date; nothing to do."
        else
          echo "needs-sync=true" >> "$GITHUB_OUTPUT"
        fi
        echo "::endgroup::"

    - name: "Replace plugin contents"
      if: steps.compare.outputs.needs-sync == 'true'
      shell: bash
      env:
        TARGET_PATH: ${{ inputs.path }}
        UPSTREAM_DIR: ${{ steps.fetch.outputs.upstream-dir }}
      run: |
        echo "::group::Replace $TARGET_PATH"
        rm -rf "$TARGET_PATH"
        mkdir -p "$(dirname "$TARGET_PATH")"
        cp -r "$UPSTREAM_DIR" "$TARGET_PATH"
        echo "::endgroup::"

    - id: pr
      name: "Open or update PR"
      if: steps.compare.outputs.needs-sync == 'true'
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ inputs.token }}
        branch: "${{ inputs.pr-branch-prefix }}-${{ steps.fetch.outputs.upstream-version }}"
        delete-branch: true
        commit-message: "chore: sync kata plugin to ${{ steps.fetch.outputs.upstream-version }}"
        title: "chore: sync kata plugin to ${{ steps.fetch.outputs.upstream-version }}"
        body: |
          Syncs `${{ inputs.path }}/` to [`0k-software/kata@${{ steps.resolve.outputs.ref }}`](https://github.com/0k-software/kata/releases/tag/${{ steps.resolve.outputs.ref }}).

          - Previous version: `${{ steps.compare.outputs.current-version }}`
          - New version: `${{ steps.fetch.outputs.upstream-version }}`

          Opened automatically by [`sync-kata-plugin`](https://github.com/0k-software/.github/tree/main/sync-kata-plugin).
