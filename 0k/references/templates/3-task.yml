name: 🛠️ Task
description: A specific piece of work, often infra, migration, or setup with little to no code involved
type: "Task"
body:
  - type: markdown
    attributes:
      value: A Task is a concrete piece of work that needs to be done, usually without much product discussion.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      value: _What is the task to be completed?_
  - type: textarea
    id: design
    attributes:
      label: Approach
      value: |
        _How will this be done technically?_

        ### Components
        _What parts are involved — new, modified, or removed._

        ### Data Flow
        _If relevant, how data moves or changes._

        ### Error Handling
        _How failures and rollback are handled._

        ### Testing
        _How will this be verified?_
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      value: |
        _Alternative approaches considered during design, with tradeoffs._

        **{Decision point}:**
        - Option A: ...
        - Option B: ...
        - ✅ Chosen: Option A — because ...
  - type: textarea
    id: steps
    attributes:
      label: Steps / Plan
      value: |
        _Break down what needs to be done, if possible._
        
        - [ ] 
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      value: |
        _Are there other tasks/issues this depends on?_

        - 

